name: Node.js CI

on:
  push:
    branches: [ main, setup-and-auth, itinerary-core, expense-tracker, ai-chat, additional-pages, ci-workflow ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-id: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Compilation
      run: npx tsc
